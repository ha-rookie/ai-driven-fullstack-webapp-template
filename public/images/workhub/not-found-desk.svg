  <path d="M515 194l-6-37 39 19Z" fill="#ffedcf" stroke="#b4b6a5" stroke-width="3" stroke-linejoin="round"/>
  <path d="M607 190l20-30 8 44Z" fill="#ffedcf" stroke="#b4b6a5" stroke-width="3" stroke-linejoin="round"/>
  <rect x="499" y="177" width="143" height="134" rx="48" fill="url(#character)" stroke="#90adb0" stroke-width="4"/>
