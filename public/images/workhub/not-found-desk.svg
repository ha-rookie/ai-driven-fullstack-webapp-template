<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">WORKHUBの余白</title>
  <desc id="desc">席を外したページを探す、小さな書類のキャラクターと静かなオフィス</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf7f7"/>
      <stop offset="1" stop-color="#f9fbf8"/>
    </linearGradient>
    <linearGradient id="character" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#fff1d9"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d0ebf5"/>
      <stop offset="1" stop-color="#f5fbf8"/>
    </linearGradient>
  </defs>
  <ellipse cx="405" cy="349" rx="338" ry="24" fill="#d3e8e7" opacity=".55"/>
  <rect x="113" y="45" width="559" height="288" rx="28" fill="url(#room)"/>
  <path d="M142 307H643" stroke="#c5e0df" stroke-width="3" stroke-linecap="round"/>
  <!-- Small office window -->
  <rect x="143" y="78" width="166" height="129" rx="15" fill="#fff" stroke="#c6e4e4" stroke-width="4"/>
  <rect x="153" y="88" width="146" height="109" rx="9" fill="url(#window)"/>
  <path d="M153 151L176 125 203 150 230 118 263 159 299 132V197H153Z" fill="#d6ebe7" opacity=".85"/>
  <path d="M226 88v109M153 143h146" stroke="#fff" stroke-width="7"/>
  <!-- A little office lamp and a tidy desk -->
  <path d="M237 246l20-53m-11 11 38 13" stroke="#759ea2" stroke-width="8" stroke-linecap="round"/>
  <path d="M268 188l37 17-10 19-41-12Z" fill="#6caaa9"/>
  <circle cx="255" cy="194" r="7" fill="#427d84"/>
  <rect x="201" y="239" width="263" height="23" rx="10" fill="#aed6d0"/>
  <rect x="214" y="258" width="12" height="66" rx="5" fill="#6faaa8"/>
  <rect x="444" y="258" width="12" height="66" rx="5" fill="#6faaa8"/>
  <rect x="309" y="212" width="45" height="27" rx="5" fill="#e1a7a0"/>
  <path d="M317 220h29M317 226h21" stroke="#fff9ef" stroke-width="3" stroke-linecap="round"/>
  <rect x="360" y="218" width="32" height="21" rx="4" fill="#fff8e8" stroke="#e0cdc2" stroke-width="2"/>
  <path d="M368 226h16M368 231h10" stroke="#aac5c1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M406 235h22" stroke="#c3d7d6" stroke-width="5" stroke-linecap="round"/>
