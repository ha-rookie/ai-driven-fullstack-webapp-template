  <path d="M616 254q20-13 28 0" fill="none" stroke="#8da5a2" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="536" cy="267" rx="12" ry="7" fill="#f3b4aa" opacity=".8"/>
  <ellipse cx="604" cy="267" rx="12" ry="7" fill="#f3b4aa" opacity=".8"/>
  <circle cx="545" cy="247" r="5" fill="#284955"/>
  <circle cx="589" cy="247" r="5" fill="#284955"/>
