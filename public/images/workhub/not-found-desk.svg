  <rect x="154" y="282" width="49" height="34" rx="7" fill="#daa995"/>
  <path d="M158 286h41l-5 30h-30Z" fill="#dfb5a1"/>
  <path d="M180 285c-8-24-22-30-24-45 21 0 29 15 24 45Zm0 0c-1-29 11-44 26-49 2 18-7 34-26 49Zm0 0c-13-13-13-32-4-45 13 11 17 28 4 45Z" fill="#79b4a5"/>
  <path d="M180 284v-39" stroke="#4d9186" stroke-width="3" stroke-linecap="round"/>
