  <circle cx="661" cy="222" r="29" fill="#fff" stroke="#4b9297" stroke-width="8"/>
  <path d="M681 244l28 28" stroke="#4b9297" stroke-width="10" stroke-linecap="round"/>
  <rect x="650" y="207" width="21" height="25" rx="4" fill="#fbf0d7" stroke="#9fc3bd" stroke-width="2"/>
  <path d="M654 215h12m-12 5h9" stroke="#9fc3bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Curious thought bubble -->
  <path d="M658 133q0-20 23-20h21q22 0 22 19v16q0 20-22 20h-12l-12 12-2-12q-18-3-18-20Z" fill="#fff" stroke="#c5dfdf" stroke-width="3"/>
