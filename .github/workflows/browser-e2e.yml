name: Browser E2E

on:
  workflow_dispatch:
  schedule:
    # Weekly browser regression + frontend performance (Mon 04:00 JST)
    - cron: '0 19 * * 0'
  pull_request:
    branches:
      - main
    paths:
      # PR Browser E2E checks the UI and WORKHUB reference harness. Worker-only
      # and infrastructure-only edits use required FULL CI boundaries instead.
      # Weekly/manual Browser E2E still exercises all desktop/mobile flows.
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/*.css'
      - 'src/frontend/**'
      - 'src/reference/**'
      - 'src/shared/**'
      - 'src/domain/**'
      - 'e2e/harness/**'
      - 'e2e/tests/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      # Speed-first PR feedback: one representative project, no duplicate
      # production bundle/performance run (required CI already builds).
      # Weekly and manual runs retain both desktop/mobile and perf evidence.
      - name: Run fast PR desktop browser scenarios
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=desktop-chromium

      - name: Run complete desktop/mobile browser scenarios
        if: github.event_name != 'pull_request'
        run: npx playwright test

      - name: Build production bundle
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Capture frontend build performance evidence
        if: github.event_name != 'pull_request'
        run: npm run performance:frontend:bundle

      - name: Run production-build browser performance evidence
        if: github.event_name != 'pull_request'
        run: npm run performance:frontend:browser

      - name: Upload browser performance evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-${{ github.run_id }}
          path: artifacts/performance/frontend-*
          if-no-files-found: warn
          retention-days: 30

      # Only public, unauthenticated /showcase screenshots; no sessions or business data.
      - name: Upload Showcase desktop/mobile visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: showcase-visual-${{ github.run_id }}
          path: test-results/browser-e2e/**/showcase-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-${{ github.run_id }}
          path: |
            test-results/browser-e2e
            test-results/frontend-performance
          if-no-files-found: ignore
          retention-days: 7
