name: SBOM generation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate lockfile manifest contract
        run: npm run supply-chain:lockfile

      - name: Reproducible clean install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: npm run supply-chain:sbom

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
