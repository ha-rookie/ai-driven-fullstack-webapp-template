name: Bootstrap Preview deploy 07f0ce1

on:
  push:
    branches:
      - bootstrap-preview-deploy-07f0ce1
    paths:
      - '.github/workflows/bootstrap-preview-deploy-07f0ce1.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: 07f0ce19fcbbccbfcc74c790f7bedb6de274ddc6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build named Preview environment
        run: CLOUDFLARE_ENV=preview npm run build
      - name: Verify generated Preview bindings
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("dist/ai_driven_fullstack_webapp_template/wrangler.json","utf8"));if(c.vars?.RUNTIME_ENVIRONMENT!=="preview")throw new Error("runtime");if(c.vars?.WORKHUB_DEMO_MODE!=="true")throw new Error("demo");if(c.d1_databases?.[0]?.database_id!=="f1ce1268-2be2-4a20-ab10-a94c32feee64")throw new Error("d1");'
      - name: Deploy fixed Preview Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
