name: D1 Preview Recovery Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REHEARSE_PREVIEW to run the remote Preview recovery rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fullstack-template-d1-preview-recovery
  cancel-in-progress: false

jobs:
  rehearse-preview-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RECOVERY_REHEARSAL_CONFIRM: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate explicit confirmation
        shell: bash
        run: test "$RECOVERY_REHEARSAL_CONFIRM" = "REHEARSE_PREVIEW"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate configured D1 recovery boundary
        run: npm run db:recovery:validate-config

      - name: Rehearse Preview D1 Time Travel recovery
        run: npm run db:recovery:preview
