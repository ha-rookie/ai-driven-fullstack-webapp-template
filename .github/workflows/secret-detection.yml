name: Secret detection

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-detection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scan tracked files for secret candidates
        shell: bash
        run: |
          set -euo pipefail
          npm run supply-chain:secrets 2>&1 | tee secret-scan-summary.txt

      - name: Upload secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.sha }}
          path: secret-scan-summary.txt
          if-no-files-found: warn
          retention-days: 14
