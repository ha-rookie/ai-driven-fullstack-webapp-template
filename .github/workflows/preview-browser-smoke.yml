name: Preview browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Run read-only Preview browser smoke
        run: npm run browser:preview:smoke
      - name: Upload Preview browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-smoke-${{ github.run_id }}
          path: test-results/preview-browser-smoke
          if-no-files-found: error
          retention-days: 14
