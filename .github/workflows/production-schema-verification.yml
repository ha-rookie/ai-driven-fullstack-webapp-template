name: Production schema verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'config/production-schema-baseline.json'
      - 'scripts/verify-production-schema.mjs'
      - 'docs/operations/PRODUCTION_SCHEMA_VERIFICATION.md'
      - '.github/workflows/production-schema-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static/self-test only
        run: npm run db:schema:verify:production -- --self-test

      - name: Upload schema baseline evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-schema-baseline
          path: |
            config/production-schema-baseline.json
            docs/operations/PRODUCTION_SCHEMA_VERIFICATION.md
          retention-days: 14
