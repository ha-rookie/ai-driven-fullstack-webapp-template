name: Temporary WORKHUB Stage4 Preview 0037 approved release

# Temporary owner-only issue command. Code merge must NOT trigger remote mutation.
# Delete this workflow and its isolated SQL/test after release evidence is recorded.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: preview-stage4-0037-release
  cancel-in-progress: false

jobs:
  approved-preview-0037:
    if: >-
      github.event.issue.number == 132 &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/release-preview-stage4-0037 4e02b918ec10d68de737e4bf873dcd2ab48178c9 MIGRATE SEED PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    env:
      APPROVED_APP_SHA: 4e02b918ec10d68de737e4bf873dcd2ab48178c9
      EXPECTED_PENDING: 0037_workhub_announcement_departments.sql
      PREVIEW_DATABASE_ID: f1ce1268-2be2-4a20-ab10-a94c32feee64
      PREVIEW_DATABASE_NAME: ai-driven-webapp-template-preview
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed on unreviewed main changes since approved application SHA
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$APPROVED_APP_SHA" HEAD
          actual="$(git diff --name-only "$APPROVED_APP_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/preview-approved-stage4-0037.yml'             'scripts/workhub-0037-preview-departments-only.sql'             'tests/preview-approved-stage4-0037.test.ts' | LC_ALL=C sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected source changes since approved Stage4 application SHA; refusing remote operation" >&2
            exit 1
          }
          git cat-file -e "$APPROVED_APP_SHA:migrations/0037_workhub_announcement_departments.sql"

      - name: Setup Node and locked tooling
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - name: Verify fail-closed Preview migration guard and exact binding
        run: |
          set -euo pipefail
          node scripts/preview-d1-migration-guard.mjs --self-test
          node scripts/preview-d1-migration-guard.mjs --check-config

      - name: Verify dedicated migration token and exact Preview D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error("Dedicated Preview D1 token/account is required");
          const headers = {Authorization: "Bearer " + token};
          const auth = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {headers});
          if (!auth.ok || !(await auth.json()).success) throw new Error("Dedicated token verification failed");
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + account
              + "/d1/database/" + process.env.PREVIEW_DATABASE_ID, {headers});
          const body = await response.json();
          if (!response.ok || body.success !== true
            || body.result?.uuid !== process.env.PREVIEW_DATABASE_ID
            || body.result?.name !== process.env.PREVIEW_DATABASE_NAME) {
            throw new Error("Refusing database identity mismatch");
          }
          console.log("Exact Preview D1 identity verified");
          JS

      - name: Verify only migration 0037 is remote pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --preview | tee preview-0037-pending.txt
          node scripts/preview-d1-migration-guard.mjs --check-plan preview-0037-pending.txt

      - name: Recheck exact pending plan and apply to Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --preview | tee preview-0037-final.txt
          node scripts/preview-d1-migration-guard.mjs --check-plan preview-0037-final.txt
          npx wrangler d1 migrations apply DB --remote --preview

      - name: Verify 0037 schema before any fixture write
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url = "https://api.cloudflare.com/client/v4/accounts/"
            + process.env.CLOUDFLARE_ACCOUNT_ID + "/d1/database/"
            + process.env.PREVIEW_DATABASE_ID + "/query";
          const response = await fetch(url, {method: "POST",
            headers: {Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
              "Content-Type": "application/json"},
            body: JSON.stringify({sql: "SELECT (SELECT COUNT(*) FROM pragma_table_info('workhub_announcements') WHERE name='audience_department') AS col, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='workhub_department_memberships') AS tbl"})});
          const body = await response.json();
          const row = body?.result?.[0]?.results?.[0];
          if (!response.ok || body.success !== true || row?.col !== 1 || row?.tbl !== 1) {
            throw new Error("Preview 0037 schema readback failed; refusing fixture writes");
          }
          console.log("0037 table/column verified");
          JS

      - name: Apply only six explicit WORKHUB Preview department assignments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --preview --file scripts/workhub-0037-preview-departments-only.sql

      - name: Verify all six exact demo department assignments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url = "https://api.cloudflare.com/client/v4/accounts/"
            + process.env.CLOUDFLARE_ACCOUNT_ID + "/d1/database/"
            + process.env.PREVIEW_DATABASE_ID + "/query";
          const pairs = [
            ["haru","engineering"], ["aoi","engineering"], ["ren","engineering"],
            ["mei","finance"], ["sora","people"], ["kai","it"],
          ];
          const conditions = pairs.map(([id, department]) =>
            "(user_id='workhub-demo-" + id + "' AND department_code='" + department + "')"
          ).join(" OR ");
          const sql = "SELECT COUNT(*) AS matches FROM workhub_department_memberships WHERE scope_id='workhub-company' AND (" + conditions + ")";
          const response = await fetch(url, {method: "POST",
            headers: {Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
              "Content-Type": "application/json"},
            body: JSON.stringify({sql})});
          const body = await response.json();
          if (!response.ok || body.success !== true || body?.result?.[0]?.results?.[0]?.matches !== 6) {
            throw new Error("Expected exact six department memberships; do not deploy");
          }
          console.log("Six explicit Preview departments verified");
          JS

      - name: Record migration and fixture evidence
        run: |
          {
            echo "### WORKHUB Stage4 #348 Preview 0037"
            echo "- Owner-authored exact issue #132 command, existing Preview environment guard"
            echo "- Approved app SHA: $APPROVED_APP_SHA"
            echo "- Preview D1 UUID: $PREVIEW_DATABASE_ID"
            echo "- Exactly one migration: $EXPECTED_PENDING"
            echo "- Six Reference departments verified"
            echo "- No Preview code deployment here; deploy is separately gated"
            echo "- No Production, secrets, Cloudflare resource changes"
          } >> "$GITHUB_STEP_SUMMARY"
