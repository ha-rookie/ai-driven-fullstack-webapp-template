name: Preview deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY PREVIEW exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch request
        run: |
          node -e 'const sha=process.argv[1], c=process.argv[2]; if(!/^[a-f0-9]{40}$/.test(sha)||c!=="DEPLOY PREVIEW") process.exit(1)' "${{ inputs.target_sha }}" "${{ inputs.confirmation }}"

      - name: Checkout exact deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Preview deploy workflow
        run: npm run deploy:preview:validate -- --target-sha=${{ inputs.target_sha }} --confirmation="${{ inputs.confirmation }}"

      - name: Validate lockfile
        run: npm run supply-chain:lockfile

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build exact deploy SHA
        run: npm run build

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: preview
    env:
      PREVIEW_DATABASE_ID: f1ce1268-2be2-4a20-ab10-a94c32feee64
      RUNTIME_ENVIRONMENT: preview
    steps:
      - name: Checkout exact deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify checked out SHA after Human Gate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate request again after Human Gate
        run: npm run deploy:preview:validate -- --target-sha=${{ inputs.target_sha }} --confirmation="${{ inputs.confirmation }}"

      - name: Validate lockfile again after Human Gate
        run: npm run supply-chain:lockfile

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build exact deploy SHA again
        run: npm run build

      - name: Validate pinned Preview target
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const text = fs.readFileSync("wrangler.jsonc", "utf8");
          if (!text.includes(process.env.PREVIEW_DATABASE_ID)) throw new Error("Pinned Preview D1 database ID mismatch");
          if (!text.includes('"previews"')) throw new Error("Preview Wrangler environment is missing");
          JS

      - name: Deploy exact SHA to Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --env preview --var RUNTIME_ENVIRONMENT:preview

      - name: Record deploy evidence
        run: |
          mkdir -p evidence
          node -e 'const fs=require("fs"); fs.writeFileSync("evidence/preview-deploy.json", JSON.stringify({targetSha:process.argv[1], workflowRunId:process.argv[2], environment:"preview", previewDatabaseId:process.argv[3], status:"deployed"}, null, 2)+"\n")' "${{ inputs.target_sha }}" "${{ github.run_id }}" "$PREVIEW_DATABASE_ID"

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-deploy-evidence-${{ inputs.target_sha }}
          path: evidence/preview-deploy.json
          retention-days: 14
