name: Preview D1 migration read-only evidence

# Issue #288: inspect the existing Preview D1 without applying migrations,
# deploying code, modifying fixtures, or changing credentials/resources.
# A repository-owner comment on WBS #132 authorizes ONLY this read-only check.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: preview-d1-readonly-evidence
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.issue.number == 132 &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/inspect-preview-d1-migrations ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      PREVIEW_DATABASE_NAME: ai-driven-webapp-template-preview
      PREVIEW_DATABASE_ID: f1ce1268-2be2-4a20-ab10-a94c32feee64

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reject wrong owner command or changed main SHA
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$COMMAND" =~ ^/inspect-preview-d1-migrations[[:space:]]+([a-f0-9]{40})$ ]]; then
            TARGET_SHA="${BASH_REMATCH[1]}"
          else
            echo "Read-only D1 inspection command format is invalid" >&2
            exit 1
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          node scripts/preview-d1-migration-guard.mjs --check-config
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Setup Node and pinned Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify pinned Cloudflare Preview D1 resource using GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const id = process.env.PREVIEW_DATABASE_ID;
          const name = process.env.PREVIEW_DATABASE_NAME;
          if (!token || !account) throw new Error("Dedicated migration read credential/account missing");
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${id}`,
            { method: "GET", headers: { Authorization: `Bearer ${token}` } },
          );
          const body = await response.json();
          if (!response.ok || body?.success !== true ||
              body?.result?.uuid !== id || body?.result?.name !== name) {
            throw new Error("Preview D1 identity mismatch; read-only inspection denied");
          }
          console.log("Pinned Preview D1 identity confirmed using GET");
          JS

      - name: List ordered pending migrations (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --preview |
            tee "$RUNNER_TEMP/preview-d1-pending.txt"

      - name: Inspect table names without querying user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --preview \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('users', 'user_preferences', 'd1_migrations') ORDER BY name;" |
            tee "$RUNNER_TEMP/preview-d1-schema.txt"
          if grep -q 'd1_migrations' "$RUNNER_TEMP/preview-d1-schema.txt"; then
            npx wrangler d1 execute DB --remote --preview \
              --command "SELECT name FROM d1_migrations WHERE name = '0038_user_preferences.sql';" |
              tee "$RUNNER_TEMP/preview-d1-migration-0038.txt"
          else
            echo "Migration history table not observed; applied state remains UNKNOWN" |
              tee "$RUNNER_TEMP/preview-d1-migration-0038.txt"
          fi

      - name: Publish non-sensitive read-only evidence
        if: success()
        shell: bash
        run: |
          {
            echo '## Preview D1 migration read-only evidence'
            echo "- main SHA: $TARGET_SHA"
            echo "- Preview database: $PREVIEW_DATABASE_NAME"
            echo "- Preview database UUID: $PREVIEW_DATABASE_ID"
            echo '- operation: GET identity, migrations list, sqlite_master SELECT, migration-name SELECT'
            echo '- No migration apply, deployment, seeding, destructive change, or credential change'
            echo
            echo '### Pending migrations (exact Wrangler output)'
            echo '~~~'
            cat "$RUNNER_TEMP/preview-d1-pending.txt"
            echo '~~~'
            echo
            echo '### Relevant table names'
            echo '~~~'
            cat "$RUNNER_TEMP/preview-d1-schema.txt"
            echo '~~~'
            echo
            echo '### 0038 migration history name'
            echo '~~~'
            cat "$RUNNER_TEMP/preview-d1-migration-0038.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
