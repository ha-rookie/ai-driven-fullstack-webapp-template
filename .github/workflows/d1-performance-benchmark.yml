name: D1 Preview Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BENCHMARK_PREVIEW to run the remote Preview benchmark
        required: true
        type: string
      profile:
        description: Benchmark profile
        required: true
        default: capacity
        type: choice
        options:
          - smoke
          - capacity

permissions:
  contents: read

concurrency:
  group: fullstack-template-d1-performance-preview
  cancel-in-progress: false

jobs:
  benchmark-preview-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "BENCHMARK_PREVIEW"

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate performance safety and D1 configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PERFORMANCE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          npm run performance:validate
          npm run db:performance:validate-config

      - name: Apply migrations to Preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --preview

      - name: Run Preview D1 benchmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PERFORMANCE_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run db:performance:preview -- --profile=${{ inputs.profile }}

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          REPORT="artifacts/performance/d1-performance-preview-${{ inputs.profile }}.md"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 Preview performance report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-preview-performance-${{ github.run_id }}
          path: artifacts/performance/d1-performance-preview-${{ inputs.profile }}.*
          if-no-files-found: warn
          retention-days: 30
