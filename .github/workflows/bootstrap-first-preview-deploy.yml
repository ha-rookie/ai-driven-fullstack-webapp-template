name: Bootstrap first Preview deploy

on:
  push:
    branches:
      - bootstrap-first-preview-deploy-0012d5a
    paths:
      - ".github/workflows/bootstrap-first-preview-deploy.yml"

permissions:
  contents: read

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy-approved-sha:
    runs-on: ubuntu-latest
    environment: preview
    env:
      TARGET_SHA: 0012d5a775659aa11466fb001514ac2b754591f0
      PREVIEW_DATABASE_ID: f1ce1268-2be2-4a20-ab10-a94c32feee64
    steps:
      - name: Checkout approved deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify immutable approved SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate lockfile
        run: npm run supply-chain:lockfile

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build approved SHA
        run: npm run build

      - name: Validate pinned Preview target
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const text = fs.readFileSync("wrangler.jsonc", "utf8");
          if (!text.includes(process.env.PREVIEW_DATABASE_ID)) throw new Error("Pinned Preview D1 database ID mismatch");
          if (!text.includes('"previews"')) throw new Error("Preview Wrangler environment is missing");
          JS

      - name: Deploy approved SHA to Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --env preview --var RUNTIME_ENVIRONMENT:preview
