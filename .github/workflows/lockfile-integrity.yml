name: Lockfile integrity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-lockfile-integrity.mjs'
      - '.github/workflows/lockfile-integrity.yml'

permissions:
  contents: read

concurrency:
  group: lockfile-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate lockfile manifest contract
        run: npm run supply-chain:lockfile

      - name: Reproducible clean install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate dependency tree
        run: npm ls --all

      - name: Verify manifests were not rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
