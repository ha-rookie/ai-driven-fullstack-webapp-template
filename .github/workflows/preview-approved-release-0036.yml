name: One-time owner-approved Preview release 0036

# Temporary owner-command bridge for the explicitly authorized Stage4 #348
# Preview release. Not a push/PR/scheduled migration or an unattended runner.
# Remove this workflow once evidence has been recorded.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: approved-preview-release-0036
  cancel-in-progress: false

jobs:
  approved-preview-release:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 132 &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/release-preview-0036 38866f4f8abe803a226f8266971c0be6ab75ebcc MIGRATE PREVIEW D1 DEPLOY PREVIEW'
    runs-on: ubuntu-latest
    environment: preview
    env:
      TARGET_SHA: 38866f4f8abe803a226f8266971c0be6ab75ebcc
      EXPECTED_PENDING: 0036_workhub_announcement_delivery.sql
      PREVIEW_DATABASE_ID: f1ce1268-2be2-4a20-ab10-a94c32feee64
      PREVIEW_DATABASE_NAME: ai-driven-webapp-template-preview
      RUNTIME_ENVIRONMENT: preview
    steps:
      - name: Check out exactly the code authorized by the user
        uses: actions/checkout@v4
        with:
          ref: 38866f4f8abe803a226f8266971c0be6ab75ebcc
          fetch-depth: 0

      - name: Recheck the owner-only explicit comment, SHA and main provenance
        env:
          APPROVAL_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_EVENT_NAME" = "issue_comment"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL_COMMAND" = "/release-preview-0036 $TARGET_SHA MIGRATE PREVIEW D1 DEPLOY PREVIEW"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (event.issue?.number !== 132 || event.comment?.author_association !== 'OWNER'
             || event.comment?.user?.login !== process.env.GITHUB_REPOSITORY_OWNER
             || event.comment?.body !== process.env.APPROVAL_COMMAND) {
            throw new Error('Owner comment provenance not verified');
          }
          JS
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          UNEXPECTED="$(git diff --name-only "$TARGET_SHA" origin/main | grep -Ev '^(\.github/workflows/preview-approved-release-0036\.yml|tests/preview-approved-release-0036\.test\.ts)$' || true)"
          test -z "$UNEXPECTED"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify fixed Preview D1 binding and offline migration safety checks
        run: |
          set -euo pipefail
          node scripts/preview-d1-migration-guard.mjs --check-config
          node scripts/preview-d1-migration-guard.mjs --self-test
          test -f migrations/0036_workhub_announcement_delivery.sql

      - name: Verify dedicated token and exact Cloudflare Preview D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const uuid = process.env.PREVIEW_DATABASE_ID;
          const expectedName = process.env.PREVIEW_DATABASE_NAME;
          if (!token || !account) throw new Error('Missing dedicated migration token/account');
          const headers = { Authorization: 'Bearer ' + token };
          const verify = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {headers});
          const verified = await verify.json();
          if (!verify.ok || verified?.success !== true) throw new Error('Migration token cannot be verified');
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + account + '/d1/database/' + uuid,
            {headers},
          );
          const db = await response.json();
          if (!response.ok || db?.success !== true
             || db?.result?.uuid !== uuid || db?.result?.name !== expectedName) {
            throw new Error('Unexpected Cloudflare D1 account/database; no migration allowed');
          }
          console.log('Exact authorized Preview D1 name and UUID verified');
          JS

      - name: List remote pending migrations and require only approved 0036
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --preview | tee /tmp/preview-pending-0036.txt
          node scripts/preview-d1-migration-guard.mjs --check-plan /tmp/preview-pending-0036.txt

      - name: Double-check remote pending plan, then apply only approved migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --preview | tee /tmp/preview-pending-0036-final.txt
          node scripts/preview-d1-migration-guard.mjs --check-plan /tmp/preview-pending-0036-final.txt
          npx wrangler d1 migrations apply DB --remote --preview

      - name: Read back exactly four new columns before allowing deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --preview --json \
            --command="SELECT name FROM pragma_table_info('workhub_announcements') WHERE name IN ('importance', 'audience_role', 'visible_from', 'visible_until') ORDER BY name" \
            > /tmp/preview-schema-0036.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/preview-schema-0036.json', 'utf8'));
          const blocks = Array.isArray(payload) ? payload : [payload];
          const names = blocks.flatMap(block => Array.isArray(block?.results) ? block.results : [])
            .map(row => row.name).sort();
          const expected = ['audience_role', 'importance', 'visible_from', 'visible_until'];
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error('Preview D1 post-migration schema does not match approved 0036');
          }
          console.log('Remote Preview schema 0036 verified; code deployment may proceed');
          JS

      - name: Build exact approved code for Preview only
        run: |
          set -euo pipefail
          npm run supply-chain:lockfile
          CLOUDFLARE_ENV=preview npm run build

      - name: Require generated Cloudflare deploy config pinned to Preview
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = '.wrangler/deploy/config.json';
          if (!fs.existsSync(path)) throw new Error('Expected Vite-generated Wrangler deployment config absent');
          const target = JSON.parse(fs.readFileSync(path, 'utf8'));
          const matches = target.d1_databases;
          if (target.name !== 'ai-driven-fullstack-webapp-template-preview'
             || !Array.isArray(matches) || matches.length !== 1
             || matches[0].binding !== 'DB'
             || matches[0].database_id !== process.env.PREVIEW_DATABASE_ID
             || target.vars?.RUNTIME_ENVIRONMENT !== 'preview') {
            throw new Error('Generated deployment config is not the approved Preview worker/DB');
          }
          console.log('Generated Cloudflare deployment config is strictly Preview');
          JS

      - name: Deploy only approved SHA to Preview after successful D1 schema verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          npx wrangler deploy

      - name: Publish success evidence to the project Roadmap issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body "✅ One-time owner-authorized Preview release SUCCESS. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID | Code SHA: $TARGET_SHA | Preview D1: $PREVIEW_DATABASE_ID | Migration: $EXPECTED_PENDING | Applied and schema readback verified before Preview code deployment. Production untouched."

      - name: Publish failed/blocked evidence to the project Roadmap issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body "⚠️ One-time owner-authorized Preview release FAILED/BLOCKED. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID | Target SHA: $TARGET_SHA | Review steps before further operations; D1 may already have been applied if failure occurred after the apply step. Do not run Preview deployment separately without confirming actual D1 state."

  inspect-approved-preview-config:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 132 &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/inspect-preview-config-0036 38866f4f8abe803a226f8266971c0be6ab75ebcc READ ONLY'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 38866f4f8abe803a226f8266971c0be6ab75ebcc
    steps:
      - name: Checkout exact previously approved code
        uses: actions/checkout@v4
        with:
          ref: 38866f4f8abe803a226f8266971c0be6ab75ebcc
          fetch-depth: 0

      - name: Require owner Issue command, current main ancestry, and unchanged application
        env:
          APPROVAL_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL_COMMAND" = "/inspect-preview-config-0036 $TARGET_SHA READ ONLY"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          UNEXPECTED="$(git diff --name-only "$TARGET_SHA" origin/main | grep -Ev '^(\.github/workflows/preview-approved-release-0036\.yml|tests/preview-approved-release-0036\.test\.ts)$' || true)"
          test -z "$UNEXPECTED"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build but never deploy Preview Vite plugin output
        run: CLOUDFLARE_ENV=preview npm run build

      - name: Report safe generated target fields only
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = '.wrangler/deploy/config.json';
          if (!fs.existsSync(file)) throw new Error('No generated Wrangler config to inspect');
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          const publicInfo = {
            selectedBuildMode: 'CLOUDFLARE_ENV=preview',
            worker: config.name ?? null,
            topLevelKeys: Object.keys(config),
            runtimeLabel: config.vars?.RUNTIME_ENVIRONMENT ?? null,
            d1Bindings: (config.d1_databases ?? []).map(
              item => ({binding: item.binding, database_id: item.database_id,
                         preview_database_id: item.preview_database_id, database_name: item.database_name}),
            ),
          };
          console.log(JSON.stringify(publicInfo, null, 2));
          fs.writeFileSync('/tmp/preview-config-public-info.json', JSON.stringify(publicInfo));
          JS

      - name: Post read-only diagnostic result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body "🔎 Read-only Preview config inspection SUCCESS; no DB write/deploy. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID | Generated target fields: $(cat /tmp/preview-config-public-info.json)"

      - name: Record diagnostic failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 132 --repo "$GITHUB_REPOSITORY" --body "⚠️ Read-only Preview config inspection failed; no DB write/deploy. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
