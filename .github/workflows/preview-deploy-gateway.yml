name: Preview operations gateway

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-preview:
    if: >-
      github.event.issue.number == 132 &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      (startsWith(github.event.comment.body, '/deploy-preview ') ||
       startsWith(github.event.comment.body, '/verify-preview ') ||
       github.event.comment.body == '/verify-preview-browser')
    runs-on: ubuntu-latest
    steps:
      - name: Parse and validate owner command
        id: request
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$COMMAND" =~ ^/deploy-preview[[:space:]]+([a-f0-9]{40})[[:space:]]+DEPLOY[[:space:]]+PREVIEW$ ]]; then
            echo "operation=deploy" >> "$GITHUB_OUTPUT"
            echo "target_sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMAND" =~ ^/verify-preview[[:space:]]+([a-f0-9]{40})$ ]]; then
            echo "operation=smoke" >> "$GITHUB_OUTPUT"
            echo "target_sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMAND" == "/verify-preview-browser" ]]; then
            echo "operation=browser" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid Preview operation command" >&2
            exit 1
          fi

      - name: Checkout main for ancestry validation
        if: steps.request.outputs.operation != 'browser'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require target SHA to be merged into main
        if: steps.request.outputs.operation != 'browser'
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Dispatch guarded Preview deploy workflow
        if: steps.request.outputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          gh workflow run preview-deploy.yml \
            --ref main \
            -f target_sha="$TARGET_SHA" \
            -f confirmation="DEPLOY PREVIEW"

      - name: Dispatch read-only Preview HTTP smoke workflow
        if: steps.request.outputs.operation == 'smoke'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          gh workflow run preview-smoke.yml \
            --ref main \
            -f deployed_sha="$TARGET_SHA"

      - name: Dispatch read-only Preview browser smoke workflow
        if: steps.request.outputs.operation == 'browser'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run preview-browser-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Record gateway evidence
        run: |
          echo "Preview operation '${{ steps.request.outputs.operation }}' dispatched from issue #${{ github.event.issue.number }} by ${{ github.actor }}"
