name: Preview auth historical Worker metrics (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-auth-metrics
  cancel-in-progress: false

jobs:
  inspect-historical-incident:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout fixed main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline incident analytics validator
        run: node scripts/preview-auth-metrics.mjs --self-test
      - name: Read ONLY historical Preview Worker invocation metrics
        run: node scripts/preview-auth-metrics.mjs --query
