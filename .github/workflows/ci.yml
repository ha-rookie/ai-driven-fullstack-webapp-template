name: Full-stack template CI

on:
  workflow_dispatch:
  schedule:
    # Weekly full regression, Mon 03:30 JST (Sun 18:30 UTC)
    - cron: '30 18 * * 0'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fullstack-template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select required validation tier (fail-closed)
        id: impact
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/ci-change-impact.mjs --self-test
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-change-impact.mjs --base "$CHANGE_BASE" --head "$CHANGE_HEAD"
          else
            node scripts/ci-change-impact.mjs --full
          fi

      - name: Verify read-only Preview change planner
        if: steps.impact.outputs.tier == 'full'
        run: node scripts/preview-change-plan.mjs --self-test

      - name: Install dependencies
        if: steps.impact.outputs.tier != 'docs'
        run: npm ci

      - name: Validate public repository entrypoints
        run: node scripts/validate-public-readiness.mjs

      - name: Migrate local D1
        if: steps.impact.outputs.tier == 'full'
        run: npm run db:migrate:local

      - name: Verify local D1 schema
        if: steps.impact.outputs.tier == 'full'
        shell: bash
        run: |
          set -euo pipefail
          npm run db:verify:local | tee /tmp/d1-schema.txt
          grep -q 'table:example_resources' /tmp/d1-schema.txt
          grep -q 'table:example_resource_changes' /tmp/d1-schema.txt
          grep -q 'table:example_resource_scope_bindings' /tmp/d1-schema.txt
          grep -q 'table:users' /tmp/d1-schema.txt
          grep -q 'table:external_identities' /tmp/d1-schema.txt
          grep -q 'table:application_sessions' /tmp/d1-schema.txt
          grep -q 'table:resource_scopes' /tmp/d1-schema.txt
          grep -q 'table:scope_memberships' /tmp/d1-schema.txt
          grep -q 'column:example_resources:status' /tmp/d1-schema.txt
          grep -q 'column:example_resources:version' /tmp/d1-schema.txt

      # The always-on FULL core still checks unit/contracts, auth/session,
      # migration, D1 schema, safety and deployment self-tests. Two expensive
      # isolated D1 suites run only for affected paths in PRs.
      - name: Full local validation core
        if: steps.impact.outputs.tier == 'full'
        run: npm run validate:local:core

      - name: D1 local performance regression (impact selected)
        if: steps.impact.outputs.tier == 'full' && steps.impact.outputs.performance == 'true'
        run: npm run performance:local

      - name: Operation mode local D1 regression (impact selected)
        if: steps.impact.outputs.tier == 'full' && steps.impact.outputs.operation_mode == 'true'
        run: npm run operation-mode:local

      - name: Lint
        if: steps.impact.outputs.tier != 'docs'
        run: npm run lint

      - name: Build
        if: steps.impact.outputs.tier != 'docs'
        run: npm run build

      - name: Seed protected boundary fixture
        if: steps.impact.outputs.tier == 'full'
        run: npx wrangler d1 execute DB --local --file tests/fixtures/protected-boundary.sql

      - name: Runtime and protected boundary test
        if: steps.impact.outputs.tier == 'full'
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/fullstack-template-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/api/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/fullstack-template-vite.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            --dump-header /tmp/health-headers.txt \
            -H 'x-request-id: smoke-request-001' \
            http://127.0.0.1:4173/api/health > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -qi '^x-request-id: smoke-request-001' /tmp/health-headers.txt

          curl --fail --silent --show-error http://127.0.0.1:4173/api/health/database > /tmp/database-health.json
          grep -q '"status":"ok"' /tmp/database-health.json

          AUTH_STATUS=$(curl --silent --output /tmp/auth-me.json --dump-header /tmp/auth-me-headers.txt --write-out '%{http_code}' -H 'x-request-id: smoke-auth-001' http://127.0.0.1:4173/api/auth/me)
          test "$AUTH_STATUS" = "401"
          grep -q '"authenticated":false' /tmp/auth-me.json
          grep -qi '^x-request-id: smoke-auth-001' /tmp/auth-me-headers.txt

          CSRF_UNAUTH_STATUS=$(curl --silent --output /tmp/csrf-unauth.json --write-out '%{http_code}' http://127.0.0.1:4173/api/auth/csrf)
          test "$CSRF_UNAUTH_STATUS" = "401"
          grep -q '"code":"authentication_required"' /tmp/csrf-unauth.json

          LOGOUT_STATUS=$(curl --silent --output /dev/null --dump-header /tmp/logout-headers.txt --write-out '%{http_code}' -X POST http://127.0.0.1:4173/api/auth/logout)
          test "$LOGOUT_STATUS" = "204"
          grep -qi '^set-cookie: app_session=;' /tmp/logout-headers.txt
          grep -qi 'HttpOnly' /tmp/logout-headers.txt
          grep -qi 'Secure' /tmp/logout-headers.txt
          grep -qi 'SameSite=Lax' /tmp/logout-headers.txt
          grep -qi '^x-request-id:' /tmp/logout-headers.txt

          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null

          API_STATUS=$(curl --silent --output /tmp/api-not-found.json --dump-header /tmp/api-not-found-headers.txt --write-out '%{http_code}' -H 'x-request-id: smoke-not-found-001' http://127.0.0.1:4173/api/not-found)
          test "$API_STATUS" = "404"
          grep -q '"code":"not_found"' /tmp/api-not-found.json
          grep -qi '^x-request-id: smoke-not-found-001' /tmp/api-not-found-headers.txt

          RESOURCE_A='http://127.0.0.1:4173/api/scopes/scope-a/example-resources/resource-a'
          RESOURCE_B='http://127.0.0.1:4173/api/scopes/scope-b/example-resources/resource-a'
          STATUS_A="$RESOURCE_A/status"
          CSRF_URL='http://127.0.0.1:4173/api/auth/csrf'
          EDITOR_COOKIE='app_session=boundary-editor-token'
          VIEWER_COOKIE='app_session=boundary-viewer-token'
          SCOPE_B_COOKIE='app_session=boundary-scope-b-token'

          get_csrf_token() {
            local cookie="$1"
            curl --fail --silent --show-error --cookie "$cookie" "$CSRF_URL" \
              | sed -n 's/.*"csrfToken":"\([^"]*\)".*/\1/p'
          }

          EDITOR_CSRF=$(get_csrf_token "$EDITOR_COOKIE")
          VIEWER_CSRF=$(get_csrf_token "$VIEWER_COOKIE")
          SCOPE_B_CSRF=$(get_csrf_token "$SCOPE_B_COOKIE")
          test -n "$EDITOR_CSRF"
          test -n "$VIEWER_CSRF"
          test -n "$SCOPE_B_CSRF"

          assert_resource_state() {
            local expected_name="$1"
            local expected_status="$2"
            local expected_version="$3"
            curl --fail --silent --show-error \
              --cookie "$EDITOR_COOKIE" \
              "$RESOURCE_A" > /tmp/boundary-resource-state.json
            grep -q "\"name\":\"$expected_name\"" /tmp/boundary-resource-state.json
            grep -q "\"status\":\"$expected_status\"" /tmp/boundary-resource-state.json
            grep -q "\"version\":$expected_version" /tmp/boundary-resource-state.json
          }

          curl --fail --silent --show-error \
            --cookie "$VIEWER_COOKIE" \
            --dump-header /tmp/boundary-read-headers.txt \
            -H 'x-request-id: boundary-read-001' \
            "$RESOURCE_A" > /tmp/boundary-read.json
          grep -q '"name":"Original Resource"' /tmp/boundary-read.json
          grep -qi '^x-request-id: boundary-read-001' /tmp/boundary-read-headers.txt

          UNAUTH_STATUS=$(curl --silent --output /tmp/boundary-unauth.json --write-out '%{http_code}' \
            -X PATCH -H 'content-type: application/json' \
            --data '{"name":"Unauthorized Change","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$UNAUTH_STATUS" = "401"
          grep -q '"code":"authentication_required"' /tmp/boundary-unauth.json
          assert_resource_state 'Original Resource' 'draft' 1

          CSRF_MISSING_STATUS=$(curl --silent --output /tmp/boundary-csrf-missing.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X PATCH -H 'content-type: application/json' \
            --data '{"name":"CSRF Change","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$CSRF_MISSING_STATUS" = "403"
          grep -q '"code":"csrf_failed"' /tmp/boundary-csrf-missing.json
          assert_resource_state 'Original Resource' 'draft' 1

          VIEWER_WRITE_STATUS=$(curl --silent --output /tmp/boundary-viewer-write.json --write-out '%{http_code}' \
            --cookie "$VIEWER_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $VIEWER_CSRF" \
            --data '{"name":"Viewer Change","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$VIEWER_WRITE_STATUS" = "403"
          grep -q '"code":"forbidden"' /tmp/boundary-viewer-write.json
          assert_resource_state 'Original Resource' 'draft' 1

          WRONG_SCOPE_STATUS=$(curl --silent --output /tmp/boundary-wrong-scope.json --write-out '%{http_code}' \
            --cookie "$SCOPE_B_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $SCOPE_B_CSRF" \
            --data '{"name":"Wrong Scope Change","expectedVersion":1}' \
            "$RESOURCE_B")
          test "$WRONG_SCOPE_STATUS" = "403"
          grep -q '"code":"forbidden"' /tmp/boundary-wrong-scope.json
          assert_resource_state 'Original Resource' 'draft' 1

          INVALID_STATUS=$(curl --silent --output /tmp/boundary-invalid.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"name":"","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$INVALID_STATUS" = "400"
          grep -q '"code":"invalid_request"' /tmp/boundary-invalid.json
          assert_resource_state 'Original Resource' 'draft' 1

          RENAME_STATUS=$(curl --silent --output /tmp/boundary-rename.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"name":"Renamed Resource","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$RENAME_STATUS" = "200"
          grep -q '"name":"Renamed Resource"' /tmp/boundary-rename.json
          grep -q '"version":2' /tmp/boundary-rename.json
          assert_resource_state 'Renamed Resource' 'draft' 2

          STALE_STATUS=$(curl --silent --output /tmp/boundary-stale.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"name":"Stale Overwrite","expectedVersion":1}' \
            "$RESOURCE_A")
          test "$STALE_STATUS" = "409"
          grep -q '"code":"stale_update"' /tmp/boundary-stale.json
          assert_resource_state 'Renamed Resource' 'draft' 2

          INVALID_TRANSITION_STATUS=$(curl --silent --output /tmp/boundary-invalid-transition.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X POST -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"fromStatus":"draft","toStatus":"finalized","expectedVersion":2}' \
            "$STATUS_A")
          test "$INVALID_TRANSITION_STATUS" = "409"
          grep -q '"code":"invalid_transition"' /tmp/boundary-invalid-transition.json
          assert_resource_state 'Renamed Resource' 'draft' 2

          ACTIVE_STATUS=$(curl --silent --output /tmp/boundary-active.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X POST -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"fromStatus":"draft","toStatus":"active","expectedVersion":2}' \
            "$STATUS_A")
          test "$ACTIVE_STATUS" = "200"
          grep -q '"status":"active"' /tmp/boundary-active.json
          grep -q '"version":3' /tmp/boundary-active.json
          assert_resource_state 'Renamed Resource' 'active' 3

          FINALIZE_STATUS=$(curl --silent --output /tmp/boundary-finalize.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X POST -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"fromStatus":"active","toStatus":"finalized","expectedVersion":3}' \
            "$STATUS_A")
          test "$FINALIZE_STATUS" = "200"
          grep -q '"status":"finalized"' /tmp/boundary-finalize.json
          grep -q '"version":4' /tmp/boundary-finalize.json
          assert_resource_state 'Renamed Resource' 'finalized' 4

          IMMUTABLE_STATUS=$(curl --silent --output /tmp/boundary-immutable.json --write-out '%{http_code}' \
            --cookie "$EDITOR_COOKIE" \
            -X PATCH -H 'content-type: application/json' -H "x-csrf-token: $EDITOR_CSRF" \
            --data '{"name":"After Finalize","expectedVersion":4}' \
            "$RESOURCE_A")
          test "$IMMUTABLE_STATUS" = "409"
          grep -q '"code":"resource_immutable"' /tmp/boundary-immutable.json
          assert_resource_state 'Renamed Resource' 'finalized' 4

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

          npx wrangler d1 execute DB --local --command "SELECT COUNT(*) AS changeCount FROM example_resource_changes WHERE resource_id='resource-a'" > /tmp/boundary-change-count.json
          grep -q '"changeCount": 3' /tmp/boundary-change-count.json

          grep -q '"category":"authorization"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"role_required"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"resource_scope_mismatch"' /tmp/fullstack-template-vite.log
          grep -q '"action":"csrf_guard","outcome":"failure"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"csrf_proof_missing_or_invalid"' /tmp/fullstack-template-vite.log
          grep -q '"category":"mutation"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"invalid_request"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"stale"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"invalid_transition"' /tmp/fullstack-template-vite.log
          grep -q '"reason":"immutable"' /tmp/fullstack-template-vite.log
          grep -q '"action":"example_resource.rename","outcome":"success"' /tmp/fullstack-template-vite.log
          grep -q '"action":"example_resource.transition","outcome":"success"' /tmp/fullstack-template-vite.log
