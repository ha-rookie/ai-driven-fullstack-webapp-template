name: Full-stack template CI

on:
  push:
    branches:
      - issue-1-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure package lock
        id: lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated package lock
        if: github.event_name == 'push' && steps.lock.outputs.generated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
